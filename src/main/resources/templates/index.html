<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Chat Client - Investment POC</title>
  <style>
    body { font-family: Arial, Helvetica, sans-serif; max-width: 800px; margin: 2rem auto; }
    #chat { border: 1px solid #ddd; padding: 1rem; height: 400px; overflow:auto; }
    .msg { padding: 0.5rem; margin:0.4rem 0; }
    .user { background:#f0f8ff }
    .bot { background:#f8f8f8 }
  </style>
</head>
<body>
  <h1>Chat Client (POC)</h1>
  <div id="chat"></div>

  <div>
    <input id="username" placeholder="username" value="user1">
    <input id="input" style="width:60%" placeholder="Enter investment prompt (e.g. analyze AAPL MSFT)">
    <button id="send">Send</button>
    <button id="poll">Poll</button>
  </div>

  <script>
    const chat = document.getElementById('chat');
    function append(content, cls){ const d = document.createElement('div'); d.className='msg '+cls; d.textContent = content; chat.appendChild(d); chat.scrollTop = chat.scrollHeight; }

    document.getElementById('send').onclick = async () => {
      const u = document.getElementById('username').value;
      const v = document.getElementById('input').value;
      append(u+': '+v,'user');
      await fetch('/send?username='+encodeURIComponent(u)+'&prompt='+encodeURIComponent(v),{method:'POST'});
      document.getElementById('input').value='';
    }

    document.getElementById('poll').onclick = async () => {
      const r = await fetch('/poll');
      if (r.ok) {
        const arr = await r.json();
        if (arr.length===0) { append('No new messages','bot'); return; }
        arr.forEach(m => append('Analyzer: '+m.payload,'bot'));
      } else { append('Poll error: '+await r.text(),'bot'); }
    }
  </script>
</body>
</html>
